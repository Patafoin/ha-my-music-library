name: Sync to public repo

on:
  workflow_dispatch: 
#  push:
#    branches:
#      - main
#    paths:
#      - "custom_components/**"
#      - "_public_repo/**"
#      - "README.md"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          path: private
          fetch-depth: 0

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: Patafoin/ha-my-music-library
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public

      - name: Sync custom_components
        run: |
          rsync -av --delete \
            private/custom_components/ \
            public/custom_components/

      - name: Sync root files (_public_repo → repo root, excluding README.md)
        run: |
          rsync -av --exclude='README.md' \
            private/_public_repo/ \
            public/

      - name: Sync issue templates
        run: |
          mkdir -p public/.github/ISSUE_TEMPLATE
          rsync -av --delete \
            private/.github/ISSUE_TEMPLATE/ \
            public/.github/ISSUE_TEMPLATE/

      - name: Sync README and update version badge
        run: |
          VERSION=$(grep -oP '(?<="version": ")[^"]+' private/custom_components/my_music_library/manifest.json || echo "unknown")
          sed "s/version-[0-9][^-]*-blue/version-${VERSION}-blue/" private/README.md > public/README.md

      - name: Commit and push to public repo
        id: commit
        working-directory: public
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep -oP '(?<="version": ")[^"]+' custom_components/my_music_library/manifest.json || echo "unknown")
            git commit -m "v${VERSION}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: release_notes
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.commit.outputs.version }}
        run: |
          TAG="v${VERSION}"
          # Try to copy release notes from the private repo release
          BODY=$(gh release view "${TAG}" --repo Patafoin/ha-my-music-library-private --json body -q .body 2>/dev/null || true)
          if [ -n "$BODY" ]; then
            echo "$BODY" > /tmp/release_notes.md
            echo "title=$(gh release view "${TAG}" --repo Patafoin/ha-my-music-library-private --json name -q .name 2>/dev/null || echo "${TAG}")" >> "$GITHUB_OUTPUT"
          else
            # Fallback: generate from commit log
            PREV=$(git -C private log --pretty=format:"%H" -- custom_components/my_music_library/manifest.json | sed -n '2p')
            {
              echo "## What's changed"
              echo ""
              if [ -n "$PREV" ]; then
                git -C private log --pretty="- %s" "${PREV}..HEAD"
              else
                git -C private log --pretty="- %s" -20
              fi
            } > /tmp/release_notes.md
            echo "title=${TAG}" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/release_notes.md

      - name: Create GitHub release on public repo
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          VERSION: ${{ steps.commit.outputs.version }}
        run: |
          TAG="v${VERSION}"
          TITLE="${{ steps.release_notes.outputs.title }}"
          if [ -z "$TITLE" ]; then TITLE="${TAG}"; fi
          if git -C public ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists, skipping release."
          else
            gh release create "${TAG}" \
              --repo Patafoin/ha-my-music-library \
              --title "${TITLE}" \
              --notes-file /tmp/release_notes.md \
              --latest
          fi
